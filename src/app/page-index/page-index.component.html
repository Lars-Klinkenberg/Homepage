<div
  class="page-index"
  [class]="themingService.isDarkModeActive ? 'dark' : 'light'"
  >
  <div class="index-container">
    @for (pageIndex of getArray(pageCount); track pageIndex) {
      <div>
        <div
          class="index"
          ngClass="{{ getAdditionalClasses(pageIndex) }}"
          (click)="indexClick(pageIndex)"
        ></div>
      </div>
    }
  </div>
</div>
